<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg-men" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c2845"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </radialGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bg-men)" stroke="#4a78c2" stroke-width="1.5" opacity="0.7"/>
  <!-- Shield -->
  <path d="M17 14 H47 V38 Q32 54 17 38 Z" fill="#121f38" stroke="#4a78c2" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Shield inner bevel -->
  <path d="M21 18 H43 V36 Q32 48 21 36 Z" fill="none" stroke="#a9c1ec" stroke-width="0.9" opacity="0.45"/>
  <!-- Crown on top of shield -->
  <path d="M20 14 L23 8 L27 13 L32 6 L37 13 L41 8 L44 14"
        fill="none" stroke="#a9c1ec" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Sword blade (vertical, centred) -->
  <polygon points="30.5,41 33.5,41 33,14 32,12 31,14" fill="#a9c1ec"/>
  <!-- Crossguard -->
  <rect x="23" y="39" width="18" height="3.5" rx="1.8" fill="#a9c1ec"/>
  <!-- Grip -->
  <rect x="30.5" y="42" width="3" height="8" rx="1.5" fill="#4a78c2"/>
  <!-- Pommel -->
  <ellipse cx="32" cy="51.5" rx="4" ry="2.5" fill="#4a78c2"/>
</svg>
