<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg-elves" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#142a1e"/>
      <stop offset="100%" stop-color="#0b1810"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#bg-elves)" stroke="#3f9a6a" stroke-width="1.5" opacity="0.7"/>
  <!-- Bow (tall curved arc on left) -->
  <path d="M14 8 Q4 32 14 56" fill="none" stroke="#3f9a6a" stroke-width="4" stroke-linecap="round"/>
  <!-- Inner bow face -->
  <path d="M14 8 Q20 32 14 56" fill="none" stroke="#2d7050" stroke-width="2" stroke-linecap="round"/>
  <!-- Bowstring -->
  <line x1="14" y1="9" x2="14" y2="55" stroke="#a6e3bf" stroke-width="1.3"/>
  <!-- Arrow shaft -->
  <line x1="14" y1="32" x2="54" y2="32" stroke="#a6e3bf" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Arrowhead -->
  <polygon points="54,32 48,28.5 48,35.5" fill="#a6e3bf"/>
  <!-- Fletching (three lines) -->
  <line x1="18" y1="32" x2="14" y2="27" stroke="#3f9a6a" stroke-width="2" stroke-linecap="round"/>
  <line x1="18" y1="32" x2="14" y2="37" stroke="#3f9a6a" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="32" x2="16" y2="32" stroke="#3f9a6a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Upper leaf -->
  <path d="M44 21 Q55 14 53 27 Q42 27 44 21 Z" fill="#3f9a6a" opacity="0.85"/>
  <line x1="44" y1="21" x2="53" y2="27" stroke="#a6e3bf" stroke-width="0.9" opacity="0.7"/>
  <!-- Lower leaf -->
  <path d="M44 43 Q55 50 53 37 Q42 37 44 43 Z" fill="#3f9a6a" opacity="0.65"/>
  <!-- Moon crescent -->
  <path d="M36 12 Q44 16 44 24 Q38 20 36 12 Z" fill="#a6e3bf" opacity="0.35"/>
</svg>
