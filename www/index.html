<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f1117">
  <title>Bannerfall</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">

    <!-- Splash / loading screen -->
    <section id="screen-splash" class="screen active">
      <div class="splash">
        <div class="splash-logos">
          <img class="splash-logo splash-logo-bf" src="img/logo.svg" alt="Bannerfall" width="120" height="120">
        </div>
        <div class="splash-bar"><div class="splash-bar-fill" id="splash-fill"></div></div>
        <p class="splash-label" id="splash-label">Loading…</p>
      </div>
    </section>

    <!-- 0. Home / title screen -->
    <section id="screen-home" class="screen"></section>

    <!-- 1. Choose your legion -->
    <section id="screen-legion" class="screen"></section>

    <!-- 2. World map -->
    <section id="screen-map" class="screen"></section>

    <!-- 3. Battle -->
    <section id="screen-battle" class="screen">
      <div id="field">
        <canvas id="cv"></canvas>
        <div id="hint" class="hint hidden">Tap a unit card to deploy troops.</div>
        <div id="hud-overlay">
          <span id="hud-countdown" class="hud-countdown"></span>
          <button id="btn-skip" class="wave-skip hidden" aria-label="Skip to next wave">⏭ <span id="skip-reward"></span></button>
          <div id="wave-forecast" class="wave-forecast"></div>
        </div>
      </div>
      <footer id="tray"></footer>
    </section>

    <div id="modal" class="modal hidden"></div>
    <div id="rotate-msg" class="rotate-msg">
      <div class="rotate-icon">📱↻</div>
      <p>Rotate your device to landscape</p>
    </div>
  </div>

  <!-- Plain scripts (no modules, no internet): open this page straight from disk or from the iOS app -->
  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
